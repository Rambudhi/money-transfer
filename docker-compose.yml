name: money-transfer

x-app-environment: &app-environment
  APP_NAME: ${APP_NAME:-money-transfer}
  APP_VERSION: ${APP_VERSION:-1.0.0}
  APP_MODE: ${APP_MODE:-development}
  APP_ADDRESS: 0.0.0.0
  APP_PORT: ${APP_PORT:-8090}
  TZ: ${TZ:-Asia/Jakarta}

  POSTGRESQL_USERNAME: ${POSTGRESQL_USERNAME}
  POSTGRESQL_PASSWORD: ${POSTGRESQL_PASSWORD}
  POSTGRESQL_DB: ${POSTGRESQL_DB}
  POSTGRESQL_HOST: postgres
  POSTGRESQL_SCHEMA: ${POSTGRESQL_SCHEMA:-public}
  POSTGRESQL_PORT: 5432
  POSTGRESQL_MIN_IDLE_CONNECTIONS: ${POSTGRESQL_MIN_IDLE_CONNECTIONS:-2}
  POSTGRESQL_MAX_OPEN_CONNECTIONS: ${POSTGRESQL_MAX_OPEN_CONNECTIONS:-10}
  POSTGRESQL_MAX_LIFETIME: ${POSTGRESQL_MAX_LIFETIME:-30}
  POSTGRESQL_LOG_MODE: ${POSTGRESQL_LOG_MODE:-false}

  RABBITMQ_USER: ${RABBITMQ_USER}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/

services:
  # ==========================================
  # API
  # ==========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: money-transfer-api
    command: [ "./app" ]
    init: true
    ports:
      - "${APP_PORT:-8090}:${APP_PORT:-8090}"
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      disable: true
      # test:
      #   - CMD
      #   - wget
      #   - -q
      #   - --spider
      #   - http://127.0.0.1:${APP_PORT:-8090}/
      # interval: 10s
      # timeout: 5s
      # retries: 5
      # start_period: 15s
    restart: unless-stopped

  # ==========================================
  # WORKER
  # ==========================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: money-transfer-worker
    command: [ "./app", "worker" ]
    init: true
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================
  # POSTGRESQL
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: money-transfer-db
    environment:
      POSTGRES_USER: ${POSTGRESQL_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD}
      POSTGRES_DB: ${POSTGRESQL_DB}
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ==========================================
  # RABBITMQ
  # ==========================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: money-transfer-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
